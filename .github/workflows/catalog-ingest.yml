# Wikidata → reference catalog ingestion. Manual only: no schedule, never
# triggered by pushes to main, and never writes to Production.
#
# Job 1 (always): fetch a bounded CC0 snapshot, import it into a throwaway
# Postgres inside the runner, check idempotency, validate quality and lookups,
# and upload the snapshot + reports as an artifact (provenance record). It also
# audits region names for appellation designations (heuristic, report only).
# Needs no secrets.
#
# Job 2 (only when import_to_preview is ticked): works on the Preview database
# in the `catalog-preview` environment (CATALOG_PREVIEW_DATABASE_URL secret,
# PRODUCTION_DB_ENDPOINT_ID variable). It first proves, read-only, that the
# secret points at preview_endpoint_id and holds no user accounts. Then, by
# preview_mode: verify stops there; dry-run also migrates and dry-runs; import
# also applies, re-imports (must change nothing) and validates. snapshot_run_id
# imports an earlier run's snapshot (e.g. the one whose dry run was reviewed)
# instead of fetching a new one. The isolation guard refuses the Production
# endpoint and fails closed if the variable is missing.
name: Catalog ingest (Wikidata)

on:
  workflow_dispatch:
    inputs:
      row_limit:
        description: Max rows per Wikidata query (1–50000)
        type: string
        default: "5000"
      import_to_preview:
        description: Also import into the Preview database (catalog-preview environment)
        type: boolean
        default: false
      preview_mode:
        description: "Preview job: verify (read-only target check), dry-run, or import"
        type: choice
        options: [verify, dry-run, import]
        default: verify
      preview_endpoint_id:
        description: Neon endpoint the Preview secret must point at (e.g. ep-purple-hat-b7y33lux)
        type: string
        default: ""
      snapshot_run_id:
        description: Re-use the snapshot from this earlier run instead of fetching a new one
        type: string
        default: ""
      preview_record_types:
        description: Record types the Preview import may change (comma-separated; others are left untouched)
        type: string
        default: "regions,grapes"

permissions:
  contents: read
  actions: read # to download an earlier run's snapshot artifact

concurrency:
  group: catalog-ingest
  cancel-in-progress: false

jobs:
  fetch-and-validate:
    # Skipped when re-using an earlier snapshot, and for a verify-only Preview run (which needs no snapshot).
    if: ${{ inputs.snapshot_run_id == '' && !(inputs.import_to_preview == true && inputs.preview_mode == 'verify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vino
          POSTGRES_PASSWORD: vino
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vino" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vino:vino@localhost:5432/catalog
      SNAPSHOT: data/catalog/wikidata/run-${{ github.run_id }}
      ROW_LIMIT: ${{ inputs.row_limit || '5000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Wikidata snapshot (verifies class and property ids first)
        run: npm run -s catalog:fetch-wikidata -- --out "$SNAPSHOT" --limit "$ROW_LIMIT"
      - name: Audit region names for appellation designations (report only, heuristic)
        run: npm run -s catalog:audit-appellations -- --dir "$SNAPSHOT" --report "$SNAPSHOT/report-appellation-audit.json"
      - name: Migrate the throwaway database
        run: npm run -s db:migrate
      - name: Dry run
        run: npm run -s catalog:import -- --source wikidata --dir "$SNAPSHOT" --report "$SNAPSHOT/report-dry-run.json"
      - name: Import
        run: npm run -s catalog:import -- --source wikidata --dir "$SNAPSHOT" --apply --report "$SNAPSHOT/report-import.json"
      - name: Re-import (must change nothing)
        run: npm run -s catalog:import -- --source wikidata --dir "$SNAPSHOT" --apply --expect-unchanged --report "$SNAPSHOT/report-reimport.json"
      - name: Validate quality, provenance and lookups
        run: npm run -s catalog:validate -- --source wikidata --report "$SNAPSHOT/report-validate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wikidata-snapshot-${{ github.run_id }}
          path: ${{ env.SNAPSHOT }}
          retention-days: 30
          if-no-files-found: warn

  import-preview:
    needs: fetch-and-validate
    if: ${{ !cancelled() && inputs.import_to_preview == true && (needs.fetch-and-validate.result == 'success' || (needs.fetch-and-validate.result == 'skipped' && (inputs.snapshot_run_id != '' || inputs.preview_mode == 'verify'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: catalog-preview
    env:
      # Makes the isolation guard apply: it refuses PRODUCTION_DB_ENDPOINT_ID and fails closed without it.
      VERCEL_ENV: preview
      PRODUCTION_DB_ENDPOINT_ID: ${{ vars.PRODUCTION_DB_ENDPOINT_ID }}
      DATABASE_URL: ${{ secrets.CATALOG_PREVIEW_DATABASE_URL }}
      SNAPSHOT: snapshot
      MODE: ${{ inputs.preview_mode || 'verify' }}
      EXPECTED_ENDPOINT: ${{ inputs.preview_endpoint_id }}
      SNAPSHOT_RUN: ${{ inputs.snapshot_run_id || github.run_id }}
      ONLY: ${{ inputs.preview_record_types || 'regions,grapes' }}
    steps:
      - name: Check configuration
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::CATALOG_PREVIEW_DATABASE_URL is not set in the catalog-preview environment."; exit 1; }
          [ -n "$PRODUCTION_DB_ENDPOINT_ID" ] || { echo "::error::PRODUCTION_DB_ENDPOINT_ID variable is not set in the catalog-preview environment."; exit 1; }
          [ -n "$EXPECTED_ENDPOINT" ] || { echo "::error::Set the preview_endpoint_id input to the endpoint the secret must point at."; exit 1; }
          [ "$EXPECTED_ENDPOINT" != "$PRODUCTION_DB_ENDPOINT_ID" ] || { echo "::error::preview_endpoint_id is the Production endpoint."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prove the target (read only; endpoint and no user accounts)
        run: npm run -s catalog:inspect-target -- --expect-endpoint "$EXPECTED_ENDPOINT" --expect-no-users
      - uses: actions/download-artifact@v4
        if: ${{ env.MODE != 'verify' }}
        with:
          name: wikidata-snapshot-${{ env.SNAPSHOT_RUN }}
          path: snapshot
          run-id: ${{ env.SNAPSHOT_RUN }}
          github-token: ${{ github.token }}
      - name: Migrate Preview database (same migrations the Preview build applies)
        if: ${{ env.MODE != 'verify' }}
        run: npm run -s db:migrate
      - name: Dry run against Preview
        if: ${{ env.MODE != 'verify' }}
        run: npm run -s catalog:import -- --source wikidata --dir "$SNAPSHOT" --only "$ONLY" --report preview-dry-run.json
      - name: Import into Preview
        if: ${{ env.MODE == 'import' }}
        run: npm run -s catalog:import -- --source wikidata --dir "$SNAPSHOT" --only "$ONLY" --apply --report preview-import.json
      - name: Re-import into Preview (must change nothing)
        if: ${{ env.MODE == 'import' }}
        run: npm run -s catalog:import -- --source wikidata --dir "$SNAPSHOT" --only "$ONLY" --apply --expect-unchanged --report preview-reimport.json
      - name: Validate Preview
        if: ${{ env.MODE == 'import' }}
        run: npm run -s catalog:validate -- --source wikidata --report preview-validate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-import-${{ github.run_id }}
          path: preview-*.json
          retention-days: 30
          if-no-files-found: warn
